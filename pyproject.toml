[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memshell-ai"            # 👈 Clean, unbranded PyPI name
version = "0.1.0"
description = "In-memory virtual Unix filesystem and shell tool for AI agents"
readme = "README.md"
authors = [
    { name = "Ankush Barua", email = "ankushbarua909@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2024.1.0",
]
keywords = ["ai", "agents", "llm", "sandbox", "vfs", "shell", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Ankush0286/memshell-ai"

# Maps the PyPI package `memshell-ai` to `import memshell`
[tool.hatch.build.targets.wheel]
packages = ["src/memshell"]